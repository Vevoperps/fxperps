[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc = "0.8.24"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"

# Robinhood Chain is an Arbitrum Orbit chain. Orbit chains do not all carry the
# PUSH0 opcode that Shanghai introduced, and bytecode containing it deploys but
# reverts on the first call, which is the single most expensive way to find out.
# Paris emits no PUSH0 and runs everywhere, so it stays until the chain is
# confirmed to support Shanghai.
evm_version = "paris"

# Foundry denies scripts every filesystem access unless it is named here, and a
# deploy that cannot write its own record dies *after* printing the addresses
# and *before* broadcasting anything — the worst possible moment. Two paths and
# no more: the deployment records the scripts write, and the feed table
# `SetFeeds` reads.
fs_permissions = [
    {access = "read-write", path = "./deployments"},
    {access = "read", path = "./script"},
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
robinhood = "${RPC_URL}"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
arbitrum_sepolia = "${TESTNET_RPC_URL}"

[etherscan]
robinhood = {key = "${EXPLORER_API_KEY}", url = "${EXPLORER_API_URL}", chain = 4663}
robinhood_testnet = {key = "${EXPLORER_API_KEY}", url = "https://explorer.testnet.chain.robinhood.com/api", chain = 46630}
arbitrum_sepolia = {key = "${EXPLORER_API_KEY}", url = "https://api-sepolia.arbiscan.io/api", chain = 421614}
